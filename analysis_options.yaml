include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - lib/core/l10n/generated/**
    # Archived GetX prototype, kept for reference only (not compiled).
    - legacy/**
    # Supplied splash animation, used as-is and never edited (spec §5.A).
    - lib/features/splash/presentation/dallala_splash.dart
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - prefer_single_quotes
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - always_declare_return_types
    - avoid_print
    - require_trailing_commas
    - unawaited_futures
    - use_build_context_synchronously
