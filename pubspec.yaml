name: dallala
description: "دلّالة — سوق كردفان في جيبك. Classifieds marketplace for North Kordofan."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  go_router: ^18.1.0
  intl: ^0.20.2
  path_drawing: ^1.0.1
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.9
  build_runner: ^2.15.1
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/splash/
    - assets/app_icon/
    - assets/01-Logo/
    - assets/03-Icons/svg/
    - assets/04-Category-Icons/svg/
    - assets/05-Backgrounds/svg/

  fonts:
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: Readex Pro
      fonts:
        - asset: assets/fonts/ReadexPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ReadexPro-Bold.ttf
          weight: 700

# Native OS splash: plain terracotta only. The animated DallalaSplash takes
# over on the first Flutter frame. Run: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#B8431A"
  android_12:
    color: "#B8431A"
    icon_background_color: "#B8431A"
    image: assets/splash/splash_blank.png
  fullscreen: true
  web: false

# Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app_icon/app-icon-square.png
  min_sdk_android: 24
  adaptive_icon_background: "#B8431A"
  adaptive_icon_foreground: assets/app_icon/app-icon-foreground.png
  remove_alpha_ios: true
